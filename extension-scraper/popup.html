<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; width: 380px; background: #f0f4f8; }

    .header {
      background: #1F3864;
      color: white;
      padding: 14px 16px;
    }
    .header h1 { font-size: 15px; font-weight: 700; }
    .header p  { font-size: 11px; opacity: 0.8; margin-top: 2px; }

    .stats {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      background: white;
      border-bottom: 1px solid #e2e8f0;
    }
    .stat {
      flex: 1;
      text-align: center;
      padding: 8px 4px;
      background: #f8fafc;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }
    .stat .num { font-size: 22px; font-weight: 700; color: #1F3864; }
    .stat .lbl { font-size: 10px; color: #64748b; margin-top: 2px; }

    .actions {
      padding: 10px 12px;
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      padding: 9px 8px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.88; }
    #btn-scrape  { background: #1F3864; color: white; }
    #btn-clear   { background: #fee2e2; color: #991b1b; }
    #btn-export  { background: #d1fae5; color: #065f46; }

    .status {
      margin: 0 12px 8px;
      padding: 7px 10px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 600;
      display: none;
    }
    .status.ok      { background: #d1fae5; color: #065f46; display: block; }
    .status.info    { background: #dbeafe; color: #1e40af; display: block; }
    .status.warning { background: #fef3c7; color: #92400e; display: block; }

    .list-header {
      padding: 6px 12px 4px;
      font-size: 11px;
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #contact-list {
      max-height: 280px;
      overflow-y: auto;
      padding: 0 12px 12px;
    }

    .contact-item {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 6px;
      position: relative;
    }
    .contact-nom   { font-size: 12px; font-weight: 700; color: #1e293b; }
    .contact-email { font-size: 11px; color: #059669; font-weight: 600; margin-top: 2px; }
    .contact-tel   { font-size: 11px; color: #64748b; margin-top: 1px; }
    .contact-src   { font-size: 10px; color: #94a3b8; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .badge-email { display: inline-block; background: #d1fae5; color: #065f46; padding: 1px 5px; border-radius: 4px; font-size: 9px; font-weight: 700; }
    .badge-nomail { display: inline-block; background: #fef3c7; color: #92400e; padding: 1px 5px; border-radius: 4px; font-size: 9px; font-weight: 700; }

    .tip {
      margin: 0 12px 10px;
      padding: 8px 10px;
      background: #eff6ff;
      border-left: 3px solid #3b82f6;
      border-radius: 0 7px 7px 0;
      font-size: 10px;
      color: #1e40af;
      line-height: 1.5;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
  </style>
</head>
<body>

<div class="header">
  <h1>🔍 Scraper Avocats Paris</h1>
  <p>Extrait nom · email · téléphone de la page actuelle</p>
</div>

<div class="stats">
  <div class="stat">
    <div class="num" id="count-total">0</div>
    <div class="lbl">Contacts</div>
  </div>
  <div class="stat">
    <div class="num" id="count-emails">0</div>
    <div class="lbl">Emails</div>
  </div>
  <div class="stat">
    <div class="num" id="count-tels">0</div>
    <div class="lbl">Téléphones</div>
  </div>
  <div class="stat">
    <div class="num" id="count-pages">0</div>
    <div class="lbl">Pages</div>
  </div>
</div>

<div class="actions">
  <button id="btn-scrape">⚡ Extraire cette page</button>
  <button id="btn-export">⬇ Export Excel</button>
  <button id="btn-clear">🗑</button>
</div>

<div id="status" class="status"></div>

<div class="tip" id="tip">
  💡 Navigue sur <b>Pages Jaunes</b>, <b>avocat.fr</b> ou <b>Google</b> puis clique <b>Extraire</b> sur chaque page de résultats.
</div>

<div class="list-header" id="list-header" style="display:none">Contacts collectés</div>
<div id="contact-list"></div>

<script src="popup.js"></script>
</body>
</html>
